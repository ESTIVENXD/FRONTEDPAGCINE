<div class="container mt-5" >
     <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">

<h1 class="fw-bold d-flex justify-content-center text-center mb-4 " >Iniciar Sesion</h1>

 <div class="card p-4 shadow-sm">
<form [formGroup]="formulario" (ngSubmit)="login()" >
    <div class="row g-3 align-items-center">
    <div class="col-auto">
    
    </div>
    <div class="form-floating mb-3">
    <input type="email" formControlName="email" class="form-control" id="floatingInput" placeholder="name@example.com" >
    <label for="floatingInput">Email</label>
</div>
  <div class="col-auto">
    @if (formulario.get('email')?.invalid && formulario.get('email')?.touched){
        <span id="passwordHelpInline" class="form-text">El email es obligatorio</span>
   }</div>
    </div>
<br>


    <div class="row g-3 align-items-center">
    <div class="col-auto">
    
    </div>
    <div class="form-floating mb-3">
    <input type="password" id="floatingInput" formControlName="password" class="form-control" placeholder="name@example.com">
    <label for="floatingInput">Password</label>
    </div>
  <div class="col-auto">
    @if (formulario.get('password')?.invalid && formulario.get('password')?.touched){
        
        <span id="passwordHelpInline" class="form-text"> El password es obligatorio</span>       
}</div>

</div>        

   <div class="d-grid gap-2 col-6 mx-auto">

    <br>
 <button type="button" class="btn btn-outline-primary">Ingersar</button>
</div>
</form>
</div>
</div>
</div>
</div>
