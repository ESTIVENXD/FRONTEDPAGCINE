<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
  <div class="row justify-content-center w-100">

        <div class="col-12 col-md-8 col-lg-5">

<h1 class="fw-bold d-flex justify-content-center text-center mb-4 fs-1" >Iniciar Sesion</h1>

 <div class="card p-5 shadow">
<form [formGroup]="formulario" (ngSubmit)="login()" >

    <div class="row g-3 align-items-center">
    <div class="form-floating mb-3">
    <input type="email" formControlName="email" class="form-control form-control-lg fs-5" id="floatingInput" placeholder="name@example.com" >
    <label for="floatingInput" class="fs-5 text-muted">Email</label>
</div>
  <div class="col-auto mt-0">
    @if (formulario.get('email')?.invalid 
    && formulario.get('email')?.touched){
        <span id="passwordHelpInline" class="form-text text-danger fw-semibold fs-6">El email es obligatorio</span>
   }</div>
    </div>

    <div class="row g-3 align-items-center mt-2">
    <div class="form-floating mb-3">

    <input type="password" id="floatingPassword" formControlName="password" class="form-control form-control-lg fs-5" placeholder="Password">
    <label for="floatingPassword" class="fs-5 text-muted">Password</label>
    </div>
  <div class="col-auto mt-0">
    @if (formulario.get('password')?.invalid 
    && formulario.get('password')?.touched){
        
        <span id="passwordHelpInline" class="form-text text-danger fw-semibold fs-6"> El password es obligatorio</span>       
}</div>
</div>        

<div class="d-grid gap-2 col-12 mx-auto mt-4">
 <button type="submit" class="btn btn-outline-primary btn-lg fs-5 fw-bold py-3">Ingersar</button>
</div>
</form>
</div>
</div>
</div>
</div>
