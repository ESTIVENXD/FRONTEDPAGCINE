<div class="container-fluid mt-5 container-fluid page-background">
  <div class="row justify-content-center g-4">
        <div class="col-12 col-md-6 col-lg-4 order-lg-2">

<h2 class="fw-bold d-flex justify-content-center text-center mb-4 ">Crear Genero:</h2>
<div class="card p-4 shadow-sm">            

    <form [formGroup]="formularioGenero" (ngSubmit)="guardarGenero()">

    <div class="row g-3 align-items-center">
    <div class="col-auto">

    <label for="nombre" class="col-form-label, text-secondary">Nombre:</label>
    </div>
    <div class=" d-flex align-items-center">

    <input type="text" id="nombre" formControlName="nombre" class="form-control" aria-describedby="passwordHelpInline">
    </div>
    <div class="col-auto">
    
    @if(formularioGenero.get('nombre')?.invalid 
    && formularioGenero.get('nombre')?.touched){
        <span id="passwordHelpInline" class="form-text"> El nombre es obligatorio</span>
    }</div>
    </div>
    <button type="submit" class="btn btn-outline-secondary w-100 mt-2">Agregar</button>
</form>
</div>
</div>


<div class="col-12 col-lg-7 mb-4">
<h2 class="fw-bold mb-4">Generos</h2>
<table class="table table-hover align-middle border shadow-sm rounded">
    <thead class="table-light">
        <tr>
        <th>Id</th>
        <th>Nombre</th>
        </tr>
    </thead>
    <tbody>
         @for(genero of generos; track genero.idgenero){
        <tr>
            <td>{{genero.idGenero}}</td>
            <td>{{genero.nombre}}</td>
        </tr>
        }
        </tbody>
</table>
</div>
</div>
</div>
